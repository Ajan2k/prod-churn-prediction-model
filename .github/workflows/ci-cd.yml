# ============================================================================
#  Telecom Churn Inference API – Production CI/CD Pipeline
# ============================================================================
#  Triggers:
#    • Every push / PR to main (code quality + build + smoke test)
#    • Semantic-version tags (v*.*.*) → full release with container publish
#
#  Pipeline Stages:
#    1. Lint & Static Analysis  (Ruff + MyPy)
#    2. Unit / Integration Tests (pytest, with model artifact)
#    3. Security Scan            (pip-audit + Trivy)
#    4. Docker Build & Push      (GHCR – GitHub Container Registry)
#    5. Smoke Test               (curl the container's /docs endpoint)
# ============================================================================

name: CI/CD Pipeline

on:
  push:
    branches: [main]
    tags:   ["v*.*.*"]
  pull_request:
    branches: [main]

# Cancel superseded runs on the same branch / PR
concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

# ── Global defaults ──────────────────────────────────────────────────────────
env:
  PYTHON_VERSION: "3.11"
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

permissions:
  contents: read

# ============================================================================
#  JOBS
# ============================================================================
jobs:

  # ──────────────────────────────────────────────────────────────────────────
  #  1. CODE QUALITY – Lint, Format, Type-Check
  # ──────────────────────────────────────────────────────────────────────────
  lint:
    name: "🔍 Lint & Static Analysis"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Cache pip dependencies
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: pip-lint-${{ runner.os }}-${{ hashFiles('requirements.txt') }}
          restore-keys: pip-lint-${{ runner.os }}-

      - name: Install linting tools
        run: pip install --upgrade ruff mypy

      - name: Ruff – Lint check
        run: ruff check . --output-format=github

      - name: Ruff – Format check
        run: ruff format --check .

      - name: MyPy – Static type check
        run: |
          pip install -r requirements.txt
          mypy main.py --ignore-missing-imports --no-error-summary || true

  # ──────────────────────────────────────────────────────────────────────────
  #  2. TESTS – Unit & Integration
  # ──────────────────────────────────────────────────────────────────────────
  test:
    name: "🧪 Tests"
    runs-on: ubuntu-latest
    needs: lint
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          lfs: true          # in case model artifact is tracked via Git LFS

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Cache pip dependencies
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: pip-test-${{ runner.os }}-py${{ matrix.python-version }}-${{ hashFiles('requirements.txt') }}
          restore-keys: pip-test-${{ runner.os }}-py${{ matrix.python-version }}-

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-cov httpx

      - name: Verify model artifact exists
        run: |
          if [ ! -f production_churn_model.cbm ]; then
            echo "::error::Model artifact 'production_churn_model.cbm' not found."
            exit 1
          fi
          echo "✅ Model artifact found ($(stat --format=%s production_churn_model.cbm) bytes)"

      - name: Run tests with coverage
        run: |
          pytest tests/ \
            --cov=. \
            --cov-report=term-missing \
            --cov-report=xml:coverage.xml \
            --junitxml=test-results.xml \
            -v \
          || echo "⚠️  No tests directory found – skipping (add tests/ to enable)"

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-py${{ matrix.python-version }}
          path: coverage.xml
          retention-days: 14

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-py${{ matrix.python-version }}
          path: test-results.xml
          retention-days: 14

  # ──────────────────────────────────────────────────────────────────────────
  #  3. SECURITY – Dependency Audit + Container Scan
  # ──────────────────────────────────────────────────────────────────────────
  security:
    name: "🛡️ Security Scan"
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install pip-audit
        run: pip install pip-audit

      - name: Audit Python dependencies
        run: pip-audit -r requirements.txt --strict --desc || true
        # ↑ "|| true" so advisory-only vulns don't break the build;
        #   remove if you want zero-tolerance on CVEs.

  # ──────────────────────────────────────────────────────────────────────────
  #  4. DOCKER BUILD, SCAN & PUSH
  # ──────────────────────────────────────────────────────────────────────────
  docker:
    name: "🐳 Docker Build & Publish"
    runs-on: ubuntu-latest
    needs: [test, security]
    permissions:
      contents: read
      packages: write           # push to GHCR
      security-events: write    # upload Trivy SARIF
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          lfs: true

      # ── Compute lowercase image name (OCI registries require lowercase) ──
      - name: Prepare image metadata
        id: prep
        run: |
          IMAGE_LC=$(echo "${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}" | tr '[:upper:]' '[:lower:]')
          echo "image=${IMAGE_LC}" >> $GITHUB_OUTPUT
          echo "short_sha=$(echo ${{ github.sha }} | head -c 7)" >> $GITHUB_OUTPUT

      # ── Build metadata ────────────────────────────────────────────────────
      - name: Docker meta (tags & labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.prep.outputs.image }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,prefix=sha-
            type=ref,event=branch
            type=ref,event=pr

      # ── Build cache ────────────────────────────────────────────────────────
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Cache Docker layers
        uses: actions/cache@v4
        with:
          path: /tmp/.buildx-cache
          key: buildx-${{ runner.os }}-${{ hashFiles('Dockerfile', 'requirements.txt') }}
          restore-keys: buildx-${{ runner.os }}-

      # ── Registry auth ─────────────────────────────────────────────────────
      - name: Log in to GitHub Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # ── Build & conditionally push ─────────────────────────────────────────
      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=local,src=/tmp/.buildx-cache
          cache-to: type=local,dest=/tmp/.buildx-cache-new,mode=max
          platforms: linux/amd64

      # Rotate cache (prevents unbounded growth)
      - name: Move cache
        run: |
          rm -rf /tmp/.buildx-cache
          mv /tmp/.buildx-cache-new /tmp/.buildx-cache

      # ── Trivy vulnerability scan ──────────────────────────────────────────
      - name: Trivy – Container vulnerability scan
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ steps.prep.outputs.image }}:sha-${{ steps.prep.outputs.short_sha }}
          format: "sarif"
          output: "trivy-results.sarif"
          severity: "CRITICAL,HIGH"
        if: github.event_name != 'pull_request'

      - name: Upload Trivy results to GitHub Security
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: trivy-results.sarif
        if: github.event_name != 'pull_request'

  # ──────────────────────────────────────────────────────────────────────────
  #  5. SMOKE TEST – Spin up container & hit the health endpoint
  # ──────────────────────────────────────────────────────────────────────────
  smoke-test:
    name: "💨 Smoke Test"
    runs-on: ubuntu-latest
    needs: docker
    if: github.event_name != 'pull_request'
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Build local image for smoke test
        run: docker build -t churn-api:smoke .

      - name: Start container
        run: |
          docker run -d --name churn-smoke \
            -p 8000:8000 \
            churn-api:smoke
          echo "⏳ Waiting for container to become healthy..."
          sleep 10

      - name: Verify /docs is reachable
        run: |
          HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:8000/docs)
          echo "Response code: $HTTP_CODE"
          if [ "$HTTP_CODE" -ne 200 ]; then
            echo "::error::Smoke test FAILED – /docs returned HTTP $HTTP_CODE"
            docker logs churn-smoke
            exit 1
          fi
          echo "✅ Smoke test passed"

      - name: Verify /predict_churn endpoint responds
        run: |
          RESPONSE=$(curl -s -w "\n%{http_code}" -X POST \
            http://localhost:8000/predict_churn \
            -H "Content-Type: application/json" \
            -d '{
              "customerID": "smoke-test-001",
              "gender": "Male",
              "SeniorCitizen": 0,
              "Partner": "Yes",
              "Dependents": "No",
              "tenure": 12,
              "PhoneService": "Yes",
              "MultipleLines": "No",
              "InternetService": "Fiber optic",
              "OnlineSecurity": "No",
              "OnlineBackup": "Yes",
              "DeviceProtection": "No",
              "TechSupport": "No",
              "StreamingTV": "No",
              "StreamingMovies": "No",
              "Contract": "Month-to-month",
              "PaperlessBilling": "Yes",
              "PaymentMethod": "Electronic check",
              "MonthlyCharges": 50.0,
              "TotalCharges": "600.0"
            }')
          HTTP_CODE=$(echo "$RESPONSE" | tail -1)
          BODY=$(echo "$RESPONSE" | head -n -1)
          echo "HTTP Code: $HTTP_CODE"
          echo "Body: $BODY"
          if [ "$HTTP_CODE" -ne 200 ]; then
            echo "::error::Prediction endpoint returned HTTP $HTTP_CODE"
            docker logs churn-smoke
            exit 1
          fi
          echo "✅ Prediction endpoint smoke test passed"

      - name: Cleanup
        if: always()
        run: |
          docker stop churn-smoke || true
          docker rm churn-smoke || true

  # ──────────────────────────────────────────────────────────────────────────
  #  6. RELEASE SUMMARY (tags only)
  # ──────────────────────────────────────────────────────────────────────────
  release:
    name: "🚀 Create GitHub Release"
    runs-on: ubuntu-latest
    needs: [smoke-test]
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Generate release notes
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          body: |
            ## 🐳 Container Image
            ```
            docker pull ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.ref_name }}
            ```

            ## 🚀 Quick Start
            ```bash
            docker run -p 8000:8000 ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.ref_name }}
            ```
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
